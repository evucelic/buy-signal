name: Build and deploy

on:
  push:
    branches: [main]
  # Weekly rebuild without the layer cache, so Chromium and the base image get security updates
  # even in weeks with no code change.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

# Nothing by default; each job asks for only what it needs.
permissions: {}

# Actions are pinned to commit SHAs, so a moved tag cannot swap in new code; Dependabot proposes updates.
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Run tests
        run: pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: |
            ghcr.io/evucelic/buy-signal:latest
            ghcr.io/evucelic/buy-signal:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # Plain ssh, so no third-party action holds the server key; the host key must match AWS_KNOWN_HOSTS.
      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.AWS_KNOWN_HOSTS }}
          HOST: ${{ secrets.AWS_HOST }}
          SSH_USER: ${{ secrets.AWS_SSH_USER }}
        run: |
          umask 077 && mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o BatchMode=yes "$SSH_USER@$HOST" \
            'cd ~/buy-signal && git pull --ff-only && docker compose pull && docker compose up -d && docker image prune -a -f'
