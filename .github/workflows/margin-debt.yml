name: Margin debt scraper smoke test

on:
  schedule:
    # Daily on days 18-31: FINRA's "third week" release window, padded to month-end.
    - cron: '0 13 18-31 * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      # Test the authoritative workbook directly: no Telegram, unrelated collectors,
      # or permanently running browser container is required by this job.
      - name: Validate FINRA workbook
        run: |
          python - <<'PY'
          from tempfile import TemporaryDirectory
          from pathlib import Path
          from buysignal.collectors.margin_debt import update_margin_debt_data, margin_history, data_freshness
          with TemporaryDirectory() as directory:
              path = Path(directory) / "margin.csv"
              error = update_margin_debt_data(path)
              if error:
                  raise RuntimeError(error)
              history = margin_history(path)
              tier, message = data_freshness(history)
              print(len(history), "monthly observations;", tier, message)
              if tier == "stale":
                  raise RuntimeError(message)
          PY
