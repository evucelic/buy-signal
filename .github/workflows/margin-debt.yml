name: Margin debt scraper smoke test

on:
  schedule:
    # Daily at 13:00 UTC, days 18-31 -- FINRA's stated "third week" release window,
    # padded through month-end since it often lands late. This is the window where
    # a broken Cloudflare bypass or scraper would actually matter locally, so that's
    # when it's worth finding out.
    - cron: '0 13 18-31 * *'
  workflow_dispatch: {}

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Test the authoritative workbook directly: no Telegram, unrelated collectors,
      # or permanently running browser container is required by this job.
      - name: Validate FINRA workbook
        run: |
          python - <<'PY'
          from tempfile import TemporaryDirectory
          from pathlib import Path
          from buysignal.collectors.margin_debt import update_margin_debt_data, margin_history, data_freshness
          with TemporaryDirectory() as directory:
              path = Path(directory) / "margin.csv"
              error = update_margin_debt_data(path)
              if error:
                  raise RuntimeError(error)
              history = margin_history(path)
              tier, message = data_freshness(history)
              print(len(history), "monthly observations;", tier, message)
              if tier == "stale":
                  raise RuntimeError(message)
          PY
